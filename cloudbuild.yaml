# Cloud Build pipeline for the Cloud Run deployment.
#
# `gcloud run deploy --source .` cannot pass --build-arg, and this image needs
# seven of them. That was not obvious before, because the old Dockerfile copied
# .env.production into the image and Next.js picked the values up from there —
# which also meant the GEMINI_API_KEY was baked into a layer. Now that env files
# are excluded, the public Firebase config has to arrive as build args instead,
# which is what this file is for.
#
# Only NEXT_PUBLIC_* values are passed at build time. They are compiled into the
# client bundle and shipped to every browser regardless, so they are not secrets
# — firestore.rules is what actually guards the data. GEMINI_API_KEY is a real
# secret and stays a runtime environment variable on the service; it must never
# appear here.

substitutions:
  _REGION: us-central1
  _SERVICE: voice-party-roadmap-game
  _REPO: cloud-run-source-deploy
  # Supplied from the local checkout. $SHORT_SHA is only populated when a build
  # is triggered from a connected Git repo; for a local `builds submit` it is
  # empty, which produced an image tag ending in ":" and a parse failure.
  _GIT_SHA: manual
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_STORAGE_BUCKET: ''
  _FIREBASE_MESSAGING_SENDER_ID: ''
  _FIREBASE_APP_ID: ''
  _FIREBASE_MEASUREMENT_ID: ''

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}
      - --build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_GIT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_GIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      # One instance, pinned. WebRTC signalling mailboxes live in process memory
      # (see lib/server/roomServer.ts), so a second container would hold its own
      # separate set and players on different instances would never connect to
      # each other's audio. Room state is in Firestore and would be fine; voice
      # would fail silently, which is the worst way for it to fail.
      - --min-instances=1
      - --max-instances=1
      # Existing runtime env vars, GEMINI_API_KEY among them, are left alone.
      # --set-env-vars would replace the whole set instead of merging.
      - --update-env-vars=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_GIT_SHA}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
